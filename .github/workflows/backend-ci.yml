name: Backend Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend
      - name: Run automated core and adapter tests
        run: npm test
        working-directory: backend
      - name: Validate published baseline snapshot
        run: npm run validate
        working-directory: backend
