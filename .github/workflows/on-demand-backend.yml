name: GitHub-Only On-Demand ISP Scanner

on:
  repository_dispatch:
    types: [trigger-backend-scan]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isp-json-snapshot
  cancel-in-progress: false

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend

      - name: Run automated backend tests
        run: npm test
        working-directory: backend

      - name: Scan MikroTik and OLT; write JSON snapshot
        run: node backend/scripts/runSync.js
        env:
          ISP_DEVICES_JSON: ${{ secrets.ISP_DEVICES_JSON }}

      - name: Ensure diagnostic snapshot exists
        if: always()
        run: |
          mkdir -p data
          if [ ! -s data/devices-status.json ]; then
            node -e 'const fs=require("fs"); const p="data/devices-status.json"; fs.writeFileSync(p, JSON.stringify({schemaVersion:2,lastUpdated:new Date().toISOString(),status:"scan_error",scannedDevices:0,onlineDevices:0,offlineDevices:0,totalActiveUsers:0,devices:[],users:[],previousUpdatedAt:null,error:"Scanner did not produce a snapshot. Check workflow logs and ISP_DEVICES_JSON configuration."},null,2)+"\n");'
          fi

      - name: Validate status snapshot
        if: always()
        run: node backend/scripts/validateSnapshot.js

      - name: Commit and push JSON snapshot
        if: always()
        run: |
          if [ ! -f data/devices-status.json ]; then
            echo "No status snapshot exists; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/devices-status.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit is required."
            exit 0
          fi
          git commit -m "chore: refresh ISP device status snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
