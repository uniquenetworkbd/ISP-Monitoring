name: GitHub-Only On-Demand ISP Scanner

on:
  repository_dispatch:
    types: [trigger-backend-scan]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner with access to ISP network'
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: write

concurrency:
  group: isp-json-snapshot
  cancel-in-progress: false

jobs:
  scan-and-commit:
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend

      - name: Scan MikroTik and OLT; write JSON snapshot
        run: node backend/scripts/runSync.js
        env:
          ISP_DEVICES_JSON: ${{ secrets.ISP_DEVICES_JSON }}

      # Always attempt to publish a diagnostic snapshot, including all-offline scans.
      # The scanner step's failure remains visible in the overall workflow result.
      - name: Commit and push JSON snapshot (including diagnostic fallback)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/devices-status.json ]; then
            echo "No status snapshot exists; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/devices-status.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit is required."
            exit 0
          fi
          git commit -m "chore: refresh ISP device status snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
